<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Login — MediSync</title>
  <meta name="description" content="MediSync Patient Portal — find nearby hospitals and track your requests.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/patient.css">
</head>
<body class="patient-login-page">
<div id="toast-container"></div>

<div class="patient-login-card">
  <div class="patient-login-logo">
    <div class="patient-login-logo-icon">🧑‍⚕️</div>
    <h1 class="patient-login-title">MediSync</h1>
    <p class="patient-login-sub">Care Connected. Lives Protected.</p>
  </div>

  <div id="login-error" class="error-msg hidden"></div>

  <form id="patient-login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Email Address <span class="req">*</span></label>
      <input type="email" id="email" name="email" class="form-control"
             placeholder="patient@email.com" value="ramesh@gmail.com" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" name="password" class="form-control"
             placeholder="••••••••" value="demo1234" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:var(--sp-2)">
      Sign In
    </button>
  </form>

  <div class="login-divider"><span>or</span></div>
  <div class="login-footer-link"><a href="index.html">← Back to Portal Selection</a></div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/resources.js"></script>
<script src="js/patient.js"></script>
</body>
</html>
