<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — MediSync</title>
  <meta name="description" content="MediSync Admin Portal — network-wide hospital oversight.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin-login-page">
<div id="toast-container"></div>

<div class="admin-login-card">
  <div class="admin-login-logo">
    <div class="admin-login-icon">⚙️</div>
    <h1 class="login-title" style="margin-top:var(--sp-4)">Admin Login</h1>
    <p class="login-sub">MediSync Network Administration</p>
  </div>

  <div id="login-error" class="error-msg hidden"></div>

  <form id="admin-login-form" novalidate>
    <div class="form-group">
      <label class="form-label" for="email">Admin Email <span class="req">*</span></label>
      <input type="email" id="email" name="email" class="form-control"
             placeholder="admin@medisync.in" value="admin@h4network.in" autocomplete="email">
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password <span class="req">*</span></label>
      <input type="password" id="password" name="password" class="form-control"
             placeholder="••••••••" value="demo1234" autocomplete="current-password">
    </div>
    <button type="submit" class="btn btn-primary btn-lg w-full" style="justify-content:center;margin-top:var(--sp-2)">
      Sign In to Admin Portal
    </button>
  </form>

  <div style="display:flex;align-items:center;gap:var(--sp-4);margin:var(--sp-6) 0">
    <div style="flex:1;height:1px;background:var(--color-border)"></div>
    <span style="font-size:var(--fs-xs);color:var(--color-text-muted)">or</span>
    <div style="flex:1;height:1px;background:var(--color-border)"></div>
  </div>
  <div style="font-size:var(--fs-sm);color:var(--color-text-muted);text-align:center">
    <a href="index.html">← Back to Portal Selection</a>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/resources.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
